<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
  </defs>
  
  <!-- Background with subtle rounded shape -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  
  <!-- Inner circular badge -->
  <circle cx="256" cy="256" r="190" fill="#0f172a" stroke="#334155" stroke-width="4" stroke-opacity="0.4" />
  
  <!-- Trend wave bars (sales analytics) -->
  <rect x="156" y="270" width="28" height="70" rx="8" fill="#334155" />
  <rect x="200" y="230" width="28" height="110" rx="8" fill="#475569" />
  <rect x="244" y="190" width="28" height="150" rx="8" fill="#10b981" />
  <rect x="288" y="150" width="28" height="190" rx="8" fill="#34d399" />
  <rect x="332" y="110" width="28" height="230" rx="8" fill="url(#accentGrad)" />

  <!-- Shopping cart front dynamic overlay -->
  <path d="M128 140 H166 L198 300 H346 L376 180 H204" 
        fill="none" 
        stroke="#f8fafc" 
        stroke-width="20" 
        stroke-linecap="round" 
        stroke-linejoin="round" />
        
  <!-- Cart Wheels -->
  <circle cx="216" cy="346" r="22" fill="#10b981" />
  <circle cx="328" cy="346" r="22" fill="#10b981" />
  <circle cx="216" cy="346" r="10" fill="#f8fafc" />
  <circle cx="328" cy="346" r="10" fill="#f8fafc" />

  <!-- Upward lightning/growth arrow -->
  <path d="M336 90 L394 90 L394 148 M390 94 L290 194" 
        fill="none" 
        stroke="#34d399" 
        stroke-width="18" 
        stroke-linecap="round" 
        stroke-linejoin="round" />
</svg>
